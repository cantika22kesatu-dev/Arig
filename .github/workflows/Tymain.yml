      # =========================================================
      # START WEB SERVER
      # =========================================================

      - name: Start AI Agent
        working-directory: app
        run: |

          nohup python3 server.py \
            > server.log 2>&1 &

          echo $! > server.pid

          sleep 3

          echo ""
          echo "=============================="
          echo "AI AGENT SERVER"
          echo "=============================="

          cat server.log || true

          echo ""
          echo "Testing local server..."

          curl -I \
            http://127.0.0.1:8080/ \
            || true


      # =========================================================
      # CLOUDFLARE
      # =========================================================

      - name: Start Cloudflare Tunnel
        run: |

          nohup cloudflared tunnel \
            --url http://127.0.0.1:8080 \
            --no-autoupdate \
            > cloudflare.log 2>&1 &

          echo $! > cloudflare.pid


          echo ""
          echo "Waiting for Cloudflare..."
          echo ""


          for i in {1..30}; do

            sleep 2


            URL=$(
              grep -oE \
              'https://[-a-zA-Z0-9]+\.trycloudflare\.com' \
              cloudflare.log |
              head -1 ||
              true
            )


            if [ -n "$URL" ]; then

              echo ""
              echo "=========================================="
              echo "          AI AGENT PUBLIC URL"
              echo "=========================================="
              echo ""
              echo "$URL"
              echo ""
              echo "=========================================="
              echo ""
              echo "Open URL tersebut di browser."
              echo ""
              echo "Setup:"
              echo "1. API Endpoint"
              echo "2. API Key"
              echo "3. Model"
              echo "4. System Prompt"
              echo ""
              echo "Kemudian:"
              echo "🔌 Test Connection"
              echo "🧪 Test AI"
              echo ""
              echo "=========================================="

              break

            fi

          done


          echo ""
          echo "===== CLOUDFLARE LOG ====="
          cat cloudflare.log


