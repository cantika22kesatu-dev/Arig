name: AI Agent Web + Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 curl

      - name: Create AI Agent server
        shell: bash
        run: |
          mkdir -p app
          cd app

          cat > server.py <<'PY'
          import json
          import os
          import re
          import time
          import urllib.request
          import urllib.error
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          HOST = "127.0.0.1"
          PORT = 8080
          CONFIG_FILE = "config.json"

          DEFAULT_CONFIG = {
              "endpoint": "",
              "apikey": "",
              "model": "",
              "system": "You are a helpful AI assistant."
          }

          def load_config():
              if not os.path.exists(CONFIG_FILE):
                  return DEFAULT_CONFIG.copy()

              try:
                  with open(CONFIG_FILE, "r", encoding="utf-8") as f:
                      data = json.load(f)

                  result = DEFAULT_CONFIG.copy()
                  result.update(data)
                  return result
              except Exception:
                  return DEFAULT_CONFIG.copy()

          def save_config(data):
              with open(CONFIG_FILE, "w", encoding="utf-8") as f:
                  json.dump(data, f, indent=2, ensure_ascii=False)

          def normalize_endpoint(endpoint):
              endpoint = (endpoint or "").strip().rstrip("/")

              if endpoint.endswith("/chat/completions"):
                  return endpoint

              if endpoint.endswith("/v1"):
                  return endpoint + "/chat/completions"

              return endpoint

          def extract_text(data):
              try:
                  content = data["choices"][0]["message"]["content"]

                  if isinstance(content, str):
                      return content

                  if isinstance(content, list):
                      parts = []

                      for item in content:
                          if isinstance(item, dict):
                              if item.get("type") == "text":
                                  parts.append(str(item.get("text", "")))
                              elif "text" in item:
                                  parts.append(str(item["text"]))

                      return "".join(parts)

                  return str(content)
              except Exception:
                  pass

              try:
                  return str(data["choices"][0]["text"])
              except Exception:
                  pass

              if isinstance(data, dict):
                  for key in ["response", "content", "text", "message"]:
                      value = data.get(key)

                      if isinstance(value, str):
                          return value

              return ""

          def call_ai(message):
              config = load_config()

              endpoint = normalize_endpoint(config.get("endpoint"))
              api_key = config.get("apikey", "").strip()
              model = config.get("model", "").strip()
              system = config.get("system", "").strip()

              if not endpoint:
                  raise Exception("API Endpoint belum diatur.")

              if not api_key:
                  raise Exception("API Key belum diatur.")

              if not model:
                  raise Exception("Model belum diatur.")

              payload = {
                  "model": model,
                  "messages": [
                      {
                          "role": "system",
                          "content": system or "You are a helpful AI assistant."
                      },
                      {
                          "role": "user",
                          "content": message
                      }
                  ]
              }

              body = json.dumps(payload).encode("utf-8")

              headers = {
                  "Content-Type": "application/json",
                  "Authorization": "Bearer " + api_key,
                  "User-Agent": "AI-Agent-Web/1.0"
              }

              request = urllib.request.Request(
                  endpoint,
                  data=body,
                  headers=headers,
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(request, timeout=90) as response:
                      raw = response.read().decode("utf-8", errors="replace")
                      status = response.status

              except urllib.error.HTTPError as e:
                  error_body = e.read().decode("utf-8", errors="replace")

                  try:
                      parsed = json.loads(error_body)
                      error_body = json.dumps(parsed, ensure_ascii=False)
                  except Exception:
                      pass

                  raise Exception(
                      "HTTP {}: {}".format(e.code, error_body[:1500])
                  )

              except urllib.error.URLError as e:
                  raise Exception(
                      "Tidak dapat terhubung ke API: {}".format(e.reason)
                  )

              try:
                  data = json.loads(raw)
              except Exception:
                  raise Exception(
                      "API mengembalikan response bukan JSON: " + raw[:1000]
                  )

              text = extract_text(data)

              if not text:
                  raise Exception(
                      "Response API tidak memiliki teks jawaban: "
                      + json.dumps(data, ensure_ascii=False)[:1500]
                  )

              return {
                  "text": text,
                  "status": status
              }

          HTML = r'''
          <!DOCTYPE html>
          <html lang="id">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>AI Agent</title>

          <style>
          * {
              box-sizing: border-box;
          }

          body {
              margin: 0;
              background: #212121;
              color: #ececec;
              font-family: Arial, Helvetica, sans-serif;
              height: 100vh;
              overflow: hidden;
          }

          .app {
              display: flex;
              height: 100vh;
          }

          .sidebar {
              width: 260px;
              background: #171717;
              border-right: 1px solid #303030;
              padding: 14px;
              display: flex;
              flex-direction: column;
          }

          .brand {
              font-size: 20px;
              font-weight: 700;
              padding: 12px;
              margin-bottom: 14px;
          }

          .newchat,
          .settings {
              width: 100%;
              padding: 12px;
              border-radius: 9px;
              border: 1px solid #3a3a3a;
              background: #212121;
              color: white;
              cursor: pointer;
              margin-bottom: 10px;
              text-align: left;
          }

          .newchat:hover,
          .settings:hover {
              background: #2b2b2b;
          }

          .statusbox {
              margin-top: auto;
              background: #202020;
              border: 1px solid #333;
              border-radius: 10px;
              padding: 12px;
              font-size: 13px;
          }

          .status-dot {
              display: inline-block;
              width: 9px;
              height: 9px;
              border-radius: 50%;
              background: #777;
              margin-right: 7px;
          }

          .online {
              background: #19c37d;
          }

          .error {
              background: #ef4444;
          }

          .main {
              flex: 1;
              display: flex;
              flex-direction: column;
              min-width: 0;
          }

          .topbar {
              height: 60px;
              border-bottom: 1px solid #303030;
              display: flex;
              align-items: center;
              justify-content: space-between;
              padding: 0 22px;
              background: #212121;
          }

          .title {
              font-weight: 600;
          }

          .chat {
              flex: 1;
              overflow-y: auto;
              padding: 30px 20px 130px;
          }

          .message {
              max-width: 850px;
              margin: 0 auto 25px;
              display: flex;
              gap: 14px;
              line-height: 1.65;
              white-space: pre-wrap;
              word-break: break-word;
          }

          .avatar {
              width: 32px;
              height: 32px;
              border-radius: 6px;
              display: flex;
              align-items: center;
              justify-content: center;
              flex: 0 0 32px;
              font-size: 13px;
              font-weight: bold;
              background: #343541;
          }

          .user .avatar {
              background: #444654;
          }

          .content {
              flex: 1;
          }

          .welcome {
              max-width: 700px;
              margin: 100px auto;
              text-align: center;
          }

          .welcome h1 {
              font-size: 34px;
              margin-bottom: 12px;
          }

          .welcome p {
              color: #aaa;
          }

          .composer {
              position: fixed;
              bottom: 0;
              left: 260px;
              right: 0;
              padding: 18px 20px 24px;
              background: linear-gradient(
                  transparent,
                  #212121 25%
              );
          }

          .inputbox {
              max-width: 850px;
              margin: 0 auto;
              background: #2f2f2f;
              border: 1px solid #4a4a4a;
              border-radius: 15px;
              display: flex;
              align-items: flex-end;
              padding: 10px;
          }

          textarea {
              flex: 1;
              resize: none;
              border: none;
              outline: none;
              background: transparent;
              color: white;
              padding: 10px;
              min-height: 42px;
              max-height: 160px;
              font-size: 15px;
          }

          .send {
              width: 42px;
              height: 42px;
              border: none;
              border-radius: 9px;
              background: #fff;
              color: #111;
              cursor: pointer;
              font-weight: bold;
          }

          .send:disabled {
              opacity: .4;
              cursor: not-allowed;
          }

          .modal {
              position: fixed;
              inset: 0;
              background: rgba(0,0,0,.7);
              display: none;
              align-items: center;
              justify-content: center;
              padding: 20px;
              z-index: 20;
          }

          .modal.show {
              display: flex;
          }

          .panel {
              width: min(600px, 100%);
              background: #202020;
              border: 1px solid #3a3a3a;
              border-radius: 16px;
              padding: 24px;
              max-height: 90vh;
              overflow-y: auto;
          }

          .panel h2 {
              margin-top: 0;
          }

          label {
              display: block;
              font-size: 13px;
              color: #bbb;
              margin: 16px 0 7px;
          }

          input,
          .panel textarea {
              width: 100%;
              background: #2b2b2b;
              border: 1px solid #454545;
              border-radius: 8px;
              padding: 11px;
              color: white;
              outline: none;
              font-size: 14px;
          }

          .panel textarea {
              min-height: 100px;
              resize: vertical;
          }

          .buttons {
              display: flex;
              gap: 8px;
              margin-top: 20px;
              flex-wrap: wrap;
          }

          button {
              font-family: inherit;
          }

          .primary {
              background: white;
              color: black;
              border: none;
              border-radius: 8px;
              padding: 10px 16px;
              cursor: pointer;
          }

          .secondary {
              background: #333;
              color: white;
              border: 1px solid #4a4a4a;
              border-radius: 8px;
              padding: 10px 16px;
              cursor: pointer;
          }

          .result {
              margin-top: 15px;
              padding: 12px;
              border-radius: 8px;
              background: #181818;
              border: 1px solid #333;
              font-size: 13px;
              white-space: pre-wrap;
              display: none;
          }

          .hint {
              color: #888;
              font-size: 12px;
              margin-top: 6px;
          }

          @media (max-width: 700px) {
              .sidebar {
                  width: 70px;
                  padding: 8px;
              }

              .brand {
                  font-size: 0;
                  text-align: center;
              }

              .brand:first-letter {
                  font-size: 20px;
              }

              .newchat,
              .settings {
                  font-size: 0;
                  text-align: center;
              }

              .newchat::before {
                  content: "+";
                  font-size: 20px;
              }

              .settings::before {
                  content: "⚙";
                  font-size: 18px;
              }

              .statusbox {
                  display: none;
              }

              .composer {
                  left: 70px;
              }
          }
          </style>
          </head>

          <body>

          <div class="app">

              <aside class="sidebar">
                  <div class="brand">AI Agent</div>

                  <button class="newchat" onclick="newChat()">
                      New chat
                  </button>

                  <button class="settings" onclick="openSettings()">
                      Settings
                  </button>

                  <div class="statusbox">
                      <div>
                          <span id="dot" class="status-dot"></span>
                          <span id="statusText">Checking...</span>
                      </div>
                  </div>
              </aside>

              <main class="main">

                  <div class="topbar">
                      <div class="title">AI Agent</div>
                      <div id="modelTitle">Not configured</div>
                  </div>

                  <div id="chat" class="chat">

                      <div class="welcome" id="welcome">
                          <h1>How can I help you?</h1>
                          <p>
                              Configure API di Settings, lalu mulai
                              percakapan dengan AI Agent.
                          </p>
                      </div>

                  </div>

              </main>
          </div>

          <div class="composer">
              <div class="inputbox">
                  <textarea
                      id="message"
                      placeholder="Message AI Agent..."
                      onkeydown="handleKey(event)"
                  ></textarea>

                  <button
                      id="send"
                      class="send"
                      onclick="sendMessage()"
                  >
                      ↑
                  </button>
              </div>
          </div>

          <div id="modal" class="modal">

              <div class="panel">

                  <h2>Setup AI Agent</h2>

                  <p class="hint">
                      Masukkan konfigurasi API AI Anda.
                      API key disimpan di server workflow dan tidak
                      ditampilkan kembali di browser.
                  </p>

                  <label>API Endpoint</label>
                  <input
                      id="endpoint"
                      placeholder="https://api.example.com/v1"
                  >
                  <div class="hint">
                      Bisa menggunakan base URL /v1.
                      /chat/completions akan ditambahkan otomatis.
                  </div>

                  <label>API Key</label>
                  <input
                      id="apikey"
                      type="password"
                      placeholder="Masukkan API Key"
                  >

                  <label>Model</label>
                  <input
                      id="model"
                      placeholder="Nama model"
                  >

                  <label>System Prompt</label>
                  <textarea
                      id="system"
                      placeholder="You are a helpful AI assistant."
                  ></textarea>

                  <div class="buttons">

                      <button
                          class="primary"
                          onclick="saveSettings()"
                      >
                          Save Configuration
                      </button>

                      <button
                          class="secondary"
                          onclick="testConnection()"
                      >
                          Test Connection
                      </button>

                      <button
                          class="secondary"
                          onclick="testAI()"
                      >
                          Test AI
                      </button>

                      <button
                          class="secondary"
                          onclick="closeSettings()"
                      >
                          Close
                      </button>

                  </div>

                  <div id="result" class="result"></div>

              </div>

          </div>

          <script>
          let configured = false;

          function $(id) {
              return document.getElementById(id);
          }

          function setStatus(text, type) {
              $("statusText").textContent = text;
              $("dot").className = "status-dot";

              if (type === "online") {
                  $("dot").classList.add("online");
              }

              if (type === "error") {
                  $("dot").classList.add("error");
              }
          }

          async function loadConfig() {
              try {
                  const response = await fetch("/api/config");
                  const data = await response.json();

                  configured = data.configured;

                  $("modelTitle").textContent =
                      data.model || "Not configured";

                  if (data.endpoint) {
                      $("endpoint").value = data.endpoint;
                  }

                  if (data.model) {
                      $("model").value = data.model;
                  }

                  if (data.system) {
                      $("system").value = data.system;
                  }

                  if (!configured) {
                      setStatus("Not configured", "error");

                      setTimeout(() => {
                          openSettings();
                      }, 400);
                  } else {
                      setStatus("Configured", "");
                  }

              } catch (e) {
                  setStatus("Server error", "error");
              }
          }

          function openSettings() {
              $("modal").classList.add("show");
              $("result").style.display = "none";
          }

          function closeSettings() {
              $("modal").classList.remove("show");
          }

          async function saveSettings() {
              const data = {
                  endpoint: $("endpoint").value.trim(),
                  apikey: $("apikey").value.trim(),
                  model: $("model").value.trim(),
                  system: $("system").value.trim()
              };

              if (!data.endpoint) {
                  showResult("API Endpoint wajib diisi.", true);
                  return;
              }

              if (!data.apikey) {
                  showResult("API Key wajib diisi.", true);
                  return;
              }

              if (!data.model) {
                  showResult("Model wajib diisi.", true);
                  return;
              }

              setStatus("Saving...", "");

              try {
                  const response = await fetch(
                      "/api/config",
                      {
                          method: "POST",
                          headers: {
                              "Content-Type": "application/json"
                          },
                          body: JSON.stringify(data)
                      }
                  );

                  const result = await response.json();

                  if (!result.ok) {
                      throw new Error(result.error || "Save failed");
                  }

                  configured = true;

                  $("modelTitle").textContent = data.model;

                  setStatus("Configured", "online");

                  showResult(
                      "Konfigurasi berhasil disimpan.",
                      false
                  );

              } catch (e) {
                  setStatus("Error", "error");
                  showResult(e.message, true);
              }
          }

          async function testConnection() {
              showResult("Testing endpoint...", false);
              setStatus("Testing connection...", "");

              try {
                  const response = await fetch(
                      "/api/test-connection",
                      {
                          method: "POST",
                          headers: {
                              "Content-Type": "application/json"
                          }
                      }
                  );

                  const result = await response.json();

                  if (result.ok) {
                      setStatus("Endpoint Online", "online");

                      showResult(
                          "Connection OK\nHTTP: " +
                          result.status +
                          "\nURL: " +
                          result.url,
                          false
                      );
                  } else {
                      setStatus("Connection Error", "error");

                      showResult(
                          result.error || "Connection failed",
                          true
                      );
                  }

              } catch (e) {
                  setStatus("Connection Error", "error");
                  showResult(e.message, true);
              }
          }

          async function testAI() {
              showResult("Testing AI...", false);
              setStatus("Testing AI...", "");

              try {
                  const response = await fetch(
                      "/api/test-ai",
                      {
                          method: "POST",
                          headers: {
                              "Content-Type": "application/json"
                          }
                      }
                  );

                  const result = await response.json();

                  if (result.ok) {
                      setStatus("AI Online", "online");

                      showResult(
                          "AI TEST BERHASIL\n\n" +
                          result.text,
                          false
                      );
                  } else {
                      setStatus("AI Error", "error");

                      showResult(
                          result.error || "AI test failed",
                          true
                      );
                  }

              } catch (e) {
                  setStatus("AI Error", "error");
                  showResult(e.message, true);
              }
          }

          function showResult(text, isError) {
              $("result").style.display = "block";
              $("result").textContent = text;
          }

          function addMessage(role, text) {
              $("welcome").style.display = "none";

              const row = document.createElement("div");
              row.className = "message " + role;

              const avatar = document.createElement("div");
              avatar.className = "avatar";
              avatar.textContent =
                  role === "user" ? "U" : "AI";

              const content = document.createElement("div");
              content.className = "content";
              content.textContent = text;

              row.appendChild(avatar);
              row.appendChild(content);

              $("chat").appendChild(row);

              $("chat").scrollTop =
                  $("chat").scrollHeight;
          }

          async function sendMessage() {
              const input = $("message");
              const text = input.value.trim();

              if (!text) {
                  return;
              }

              if (!configured) {
                  openSettings();
                  return;
              }

              input.value = "";
              $("send").disabled = true;

              addMessage("user", text);

              const loadingId =
                  "loading-" + Date.now();

              const loading = document.createElement("div");
              loading.className = "message assistant";
              loading.id = loadingId;
              loading.innerHTML =
                  '<div class="avatar">AI</div>' +
                  '<div class="content">Thinking...</div>';

              $("chat").appendChild(loading);
              $("chat").scrollTop =
                  $("chat").scrollHeight;

              try {
                  const response = await fetch(
                      "/api/chat",
                      {
                          method: "POST",
                          headers: {
                              "Content-Type": "application/json"
                          },
                          body: JSON.stringify({
                              message: text
                          })
                      }
                  );

                  const result = await response.json();

                  const element =
                      document.getElementById(loadingId);

                  if (element) {
                      element.remove();
                  }

                  if (!result.ok) {
                      addMessage(
                          "assistant",
                          "Error: " +
                          (result.error || "Unknown error")
                      );

                      setStatus("AI Error", "error");
                  } else {
                      addMessage(
                          "assistant",
                          result.text
                      );

                      setStatus("AI Online", "online");
                  }

              } catch (e) {
                  const element =
                      document.getElementById(loadingId);

                  if (element) {
                      element.remove();
                  }

                  addMessage(
                      "assistant",
                      "Connection error: " + e.message
                  );

                  setStatus("Error", "error");

              } finally {
                  $("send").disabled = false;
                  input.focus();
              }
          }

          function handleKey(event) {
              if (
                  event.key === "Enter" &&
                  !event.shiftKey
              ) {
                  event.preventDefault();
                  sendMessage();
              }
          }

          function newChat() {
              $("chat").innerHTML = `
                  <div class="welcome" id="welcome">
                      <h1>How can I help you?</h1>
                      <p>
                          Mulai percakapan baru.
                      </p>
                  </div>
              `;
          }

          loadConfig();
          </script>

          </body>
          </html>
          '''

          class Handler(BaseHTTPRequestHandler):

              def send_json(self, data, status=200):
                  raw = json.dumps(
                      data,
                      ensure_ascii=False
                  ).encode("utf-8")

                  self.send_response(status)

                  self.send_header(
                      "Content-Type",
                      "application/json; charset=utf-8"
                  )

                  self.send_header(
                      "Content-Length",
                      str(len(raw))
                  )

                  self.send_header(
                      "Cache-Control",
                      "no-store"
                  )

                  self.end_headers()

                  self.wfile.write(raw)

              def send_html(self):
                  raw = HTML.encode("utf-8")

                  self.send_response(200)

                  self.send_header(
                      "Content-Type",
                      "text/html; charset=utf-8"
                  )

                  self.send_header(
                      "Content-Length",
                      str(len(raw))
                  )

                  self.end_headers()

                  self.wfile.write(raw)

              def read_json(self):
                  try:
                      length = int(
                          self.headers.get(
                              "Content-Length",
                              "0"
                          )
                      )

                      body = self.rfile.read(length)

                      return json.loads(
                          body.decode("utf-8")
                      )

                  except Exception:
                      return {}

              def do_GET(self):
                  if self.path == "/":
                      self.send_html()
                      return

                  if self.path == "/health":
                      self.send_json({
                          "ok": True,
                          "service": "AI Agent",
                          "time": time.time()
                      })
                      return

                  if self.path == "/api/config":
                      config = load_config()

                      self.send_json({
                          "configured": bool(
                              config.get("endpoint") and
                              config.get("apikey") and
                              config.get("model")
                          ),
                          "endpoint": config.get("endpoint", ""),
                          "model": config.get("model", ""),
                          "system": config.get("system", ""),
                          "has_apikey": bool(
                              config.get("apikey")
                          )
                      })

                      return

                  self.send_json(
                      {"error": "Not found"},
                      404
                  )

              def do_POST(self):
                  if self.path == "/api/config":
                      data = self.read_json()
                      old = load_config()

                      endpoint = str(
                          data.get(
                              "endpoint",
                              old.get("endpoint", "")
                          )
                      ).strip()

                      apikey = str(
                          data.get(
                              "apikey",
                              ""
                          )
                      ).strip()

                      model = str(
                          data.get(
                              "model",
                              old.get("model", "")
                          )
                      ).strip()

                      system = str(
                          data.get(
                              "system",
                              old.get("system", "")
                          )
                      ).strip()

                      if not apikey:
                          apikey = old.get(
                              "apikey",
                              ""
                          )

                      config = {
                          "endpoint": endpoint,
                          "apikey": apikey,
                          "model": model,
                          "system": system
                      }

                      save_config(config)

                      self.send_json({
                          "ok": True
                      })

                      return

                  if self.path == "/api/test-connection":
                      config = load_config()

                      endpoint = normalize_endpoint(
                          config.get("endpoint")
                      )

                      if not endpoint:
                          self.send_json({
                              "ok": False,
                              "error":
                                  "Endpoint belum dikonfigurasi."
                          }, 400)
                          return

                      try:
                          request = urllib.request.Request(
                              endpoint,
                              method="GET",
                              headers={
                                  "User-Agent":
                                      "AI-Agent-Web/1.0"
                              }
                          )

                          urllib.request.urlopen(
                              request,
                              timeout=15
                          )

                          status = 200

                      except urllib.error.HTTPError as e:
                          status = e.code

                          # HTTP 4xx/5xx tetap membuktikan
                          # server API dapat dijangkau.
                          if status in [
                              400, 401, 403, 404, 405
                          ]:
                              self.send_json({
                                  "ok": True,
                                  "status": status,
                                  "url": endpoint,
                                  "note":
                                      "Server API dapat dijangkau."
                              })
                              return

                          self.send_json({
                              "ok": False,
                              "status": status,
                              "url": endpoint,
                              "error":
                                  "Server merespons HTTP "
                                  + str(status)
                          })
                          return

                      except Exception as e:
                          self.send_json({
                              "ok": False,
                              "url": endpoint,
                              "error": str(e)
                          })
                          return

                      self.send_json({
                          "ok": True,
                          "status": status,
                          "url": endpoint
                      })

                      return

                  if self.path == "/api/test-ai":
                      try:
                          result = call_ai(
                              "Balas singkat: AI online."
                          )

                          self.send_json({
                              "ok": True,
                              "text": result["text"],
                              "status": result["status"]
                          })

                      except Exception as e:
                          self.send_json({
                              "ok": False,
                              "error": str(e)
                          }, 500)

                      return

                  if self.path == "/api/chat":
                      data = self.read_json()

                      message = str(
                          data.get("message", "")
                      ).strip()

                      if not message:
                          self.send_json({
                              "ok": False,
                              "error": "Message kosong."
                          }, 400)
                          return

                      try:
                          result = call_ai(message)

                          self.send_json({
                              "ok": True,
                              "text": result["text"],
                              "status": result["status"]
                          })

                      except Exception as e:
                          self.send_json({
                              "ok": False,
                              "error": str(e)
                          }, 500)

                      return

                  self.send_json(
                      {"error": "Not found"},
                      404
                  )

              def log_message(self, format, *args):
                  print(
                      "[HTTP]",
                      format % args,
                      flush=True
                  )

          if __name__ == "__main__":
              print(
                  "========================================",
                  flush=True
              )

              print(
                  "AI Agent server starting...",
                  flush=True
              )

              print(
                  "Listening: http://127.0.0.1:" +
                  str(PORT),
                  flush=True
              )

              print(
                  "Health: http://127.0.0.1:" +
                  str(PORT) +
                  "/health",
                  flush=True
              )

              print(
                  "========================================",
                  flush=True
              )

              server = ThreadingHTTPServer(
                  (HOST, PORT),
                  Handler
              )

              server.serve_forever()
          PY

          python3 -m py_compile server.py

          echo "Python syntax OK"

      - name: Start AI Agent
        shell: bash
        run: |
          cd app

          nohup python3 server.py > server.log 2>&1 &

          echo $! > server.pid

          sleep 3

          echo "===== SERVER LOG ====="
          cat server.log

          echo "===== HEALTH CHECK ====="

          curl \
            --fail \
            --silent \
            --show-error \
            http://127.0.0.1:8080/health

          echo
          echo "AI Agent is ONLINE."

      - name: Install Cloudflare Tunnel
        shell: bash
        run: |
          curl -L \
            --fail \
            --silent \
            --show-error \
            -o cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64

          chmod +x cloudflared

          ./cloudflared --version

      - name: Start Cloudflare Tunnel
        shell: bash
        run: |
          cd app

          nohup ../cloudflared tunnel \
            --url http://127.0.0.1:8080 \
            --no-autoupdate \
            > cloudflare.log 2>&1 &

          echo $! > cloudflare.pid

          echo "Waiting for Cloudflare URL..."

          for i in $(seq 1 30); do

            if grep -q "trycloudflare.com" cloudflare.log; then
              break
            fi

            sleep 2

          done

          echo
          echo "=========================================="
          echo "       AI AGENT PUBLIC URL"
          echo "=========================================="

          URL=$(grep -oE 'https://[-a-zA-Z0-9]+\.trycloudflare\.com' cloudflare.log | head -1 || true)

          if [ -z "$URL" ]; then
            echo "Cloudflare URL belum ditemukan."
            echo
            echo "===== CLOUDFLARE LOG ====="
            cat cloudflare.log

            echo
            echo "===== SERVER LOG ====="
            cat server.log

            exit 1
          fi

          echo "$URL"

          echo
          echo "=========================================="
          echo "Health:"
          echo "$URL/health"
          echo "=========================================="

          echo "$URL" > public_url.txt

          echo
          echo "===== CLOUDFLARE LOG ====="
          cat cloudflare.log

      - name: Verify Public Tunnel
        shell: bash
        run: |
          cd app

          URL=$(cat public_url.txt)

          echo "Testing:"
          echo "$URL/health"

          sleep 5

          curl \
            --fail \
            --silent \
            --show-error \
            --max-time 20 \
            "$URL/health"

          echo
          echo
          echo "=========================================="
          echo "PUBLIC AI AGENT BERHASIL ONLINE"
          echo "=========================================="
          echo "$URL"
          echo "=========================================="

      - name: Keep Alive
        shell: bash
        run: |
          cd app

          echo
          echo "=========================================="
          echo "AI AGENT RUNNING"
          echo "=========================================="

          echo "Public URL:"
          cat public_url.txt

          echo
          echo "Server PID:"
          cat server.pid

          echo
          echo "Cloudflare PID:"
          cat cloudflare.pid

          echo
          echo "Workflow akan tetap berjalan."

          tail -f /dev/null
