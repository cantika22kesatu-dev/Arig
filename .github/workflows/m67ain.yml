name: AI Agent ChatGPT + Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip curl

          curl -L --fail \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o cloudflared

          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared

      - name: Create AI Agent Web App
        run: |
          mkdir -p app
          cd app

          cat > server.py <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          PORT = int(os.environ.get("PORT", "8080"))
          CONFIG_FILE = "config.json"

          HTML = r'''
          <!DOCTYPE html>
          <html lang="id">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>AI Agent</title>

            <style>
              * {
                box-sizing: border-box;
              }

              body {
                margin: 0;
                background: #212121;
                color: #ececec;
                font-family:
                  Inter,
                  ui-sans-serif,
                  system-ui,
                  -apple-system,
                  BlinkMacSystemFont,
                  "Segoe UI",
                  sans-serif;
              }

              .app {
                height: 100vh;
                display: flex;
              }

              .sidebar {
                width: 260px;
                background: #171717;
                border-right: 1px solid #303030;
                padding: 12px;
                display: flex;
                flex-direction: column;
              }

              .brand {
                padding: 12px;
                font-size: 18px;
                font-weight: 700;
              }

              .newchat,
              .settings {
                width: 100%;
                border: 1px solid #424242;
                background: transparent;
                color: #fff;
                border-radius: 8px;
                padding: 11px;
                text-align: left;
                cursor: pointer;
                margin-bottom: 8px;
              }

              .newchat:hover,
              .settings:hover {
                background: #2a2a2a;
              }

              .sidebar-bottom {
                margin-top: auto;
              }

              .main {
                flex: 1;
                min-width: 0;
                display: flex;
                flex-direction: column;
              }

              .topbar {
                height: 58px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 20px;
                border-bottom: 1px solid #303030;
                background: #212121;
              }

              .model-name {
                font-weight: 600;
              }

              .status {
                font-size: 12px;
                color: #8fd694;
              }

              .messages {
                flex: 1;
                overflow-y: auto;
                padding: 30px 18px 150px;
              }

              .message {
                max-width: 850px;
                margin: 0 auto 28px;
                display: flex;
                gap: 14px;
              }

              .avatar {
                width: 34px;
                height: 34px;
                border-radius: 7px;
                display: flex;
                align-items: center;
                justify-content: center;
                flex: 0 0 34px;
                background: #10a37f;
                font-weight: 700;
              }

              .user .avatar {
                background: #565869;
              }

              .content {
                flex: 1;
                line-height: 1.65;
                white-space: pre-wrap;
                overflow-wrap: anywhere;
              }

              .composer-wrap {
                position: fixed;
                left: 260px;
                right: 0;
                bottom: 0;
                padding: 18px;
                background: linear-gradient(
                  transparent,
                  #212121 35%
                );
              }

              .composer {
                max-width: 850px;
                margin: auto;
                display: flex;
                gap: 8px;
                padding: 8px;
                background: #2f2f2f;
                border: 1px solid #555;
                border-radius: 14px;
                box-shadow: 0 4px 20px #0005;
              }

              textarea {
                flex: 1;
                resize: none;
                min-height: 46px;
                max-height: 180px;
                border: 0;
                outline: 0;
                background: transparent;
                color: #fff;
                padding: 12px;
                font: inherit;
              }

              .send {
                width: 44px;
                height: 44px;
                border: 0;
                border-radius: 9px;
                background: #fff;
                color: #111;
                cursor: pointer;
                font-size: 18px;
              }

              .send:disabled {
                opacity: .4;
              }

              .welcome {
                max-width: 850px;
                margin: 12vh auto 0;
                text-align: center;
              }

              .welcome h1 {
                font-size: 32px;
              }

              .setup {
                position: fixed;
                inset: 0;
                background: #171717;
                display: none;
                align-items: center;
                justify-content: center;
                padding: 20px;
                z-index: 20;
              }

              .setup-card {
                width: min(620px, 100%);
                background: #242424;
                border: 1px solid #444;
                border-radius: 16px;
                padding: 28px;
              }

              .setup-card h2 {
                margin-top: 0;
              }

              label {
                display: block;
                margin: 16px 0 7px;
                font-size: 14px;
              }

              input {
                width: 100%;
                padding: 12px;
                border-radius: 8px;
                border: 1px solid #555;
                background: #171717;
                color: #fff;
                outline: none;
              }

              .save {
                width: 100%;
                margin-top: 22px;
                padding: 12px;
                border: 0;
                border-radius: 8px;
                background: #10a37f;
                color: #fff;
                font-weight: 700;
                cursor: pointer;
              }

              .hint {
                color: #aaa;
                font-size: 13px;
                line-height: 1.5;
              }

              @media(max-width:700px) {
                .sidebar {
                  display: none;
                }

                .composer-wrap {
                  left: 0;
                }

                .messages {
                  padding-left: 12px;
                  padding-right: 12px;
                }
              }
            </style>
          </head>

          <body>

          <div class="app">

            <aside class="sidebar">
              <div class="brand">🤖 AI Agent</div>

              <button class="newchat" onclick="newChat()">
                ＋ New chat
              </button>

              <div class="sidebar-bottom">
                <button class="settings" onclick="openSetup()">
                  ⚙️ Settings
                </button>
              </div>
            </aside>

            <main class="main">

              <header class="topbar">
                <div class="model-name" id="modelName">
                  AI Agent
                </div>
                <div class="status" id="status">
                  Ready
                </div>
              </header>

              <section class="messages" id="messages">

                <div class="welcome" id="welcome">
                  <h1>How can I help you?</h1>
                  <p class="hint">
                    Hubungkan API AI kamu melalui Settings,
                    lalu mulai percakapan.
                  </p>
                </div>

              </section>

              <div class="composer-wrap">
                <div class="composer">
                  <textarea
                    id="input"
                    placeholder="Message AI Agent..."
                    rows="1"
                    onkeydown="handleKey(event)"
                  ></textarea>

                  <button
                    class="send"
                    id="send"
                    onclick="sendMessage()"
                  >
                    ↑
                  </button>
                </div>
              </div>

            </main>
          </div>

          <div class="setup" id="setup">
            <div class="setup-card">

              <h2>⚙️ AI Agent Setup</h2>

              <p class="hint">
                Masukkan konfigurasi API AI kamu.
                API key disimpan di server workflow ini.
              </p>

              <label>API Endpoint</label>
              <input
                id="endpoint"
                placeholder="https://api.example.com/v1/chat/completions"
              >

              <label>API Key</label>
              <input
                id="apikey"
                type="password"
                placeholder="sk-..."
              >

              <label>Model</label>
              <input
                id="model"
                placeholder="deepseek-chat"
              >

              <label>System Prompt</label>
              <input
                id="system"
                placeholder="You are a helpful AI assistant."
              >

              <button class="save" onclick="saveSetup()">
                Save & Continue
              </button>

            </div>
          </div>

          <script>
            let history = [];

            async function loadConfig() {
              const r = await fetch("/api/config");
              const c = await r.json();

              if (!c.endpoint || !c.model) {
                openSetup();
                return;
              }

              document.getElementById("modelName").textContent =
                c.model;

              document.getElementById("status").textContent =
                "Connected";

              document.getElementById("endpoint").value =
                c.endpoint || "";

              document.getElementById("apikey").value =
                c.apikey || "";

              document.getElementById("model").value =
                c.model || "";

              document.getElementById("system").value =
                c.system || "";
            }

            function openSetup() {
              document.getElementById("setup").style.display =
                "flex";
            }

            function closeSetup() {
              document.getElementById("setup").style.display =
                "none";
            }

            async function saveSetup() {
              const data = {
                endpoint:
                  document.getElementById("endpoint").value.trim(),

                apikey:
                  document.getElementById("apikey").value.trim(),

                model:
                  document.getElementById("model").value.trim(),

                system:
                  document.getElementById("system").value.trim()
              };

              if (!data.endpoint || !data.model) {
                alert("Endpoint dan Model wajib diisi.");
                return;
              }

              const r = await fetch("/api/config", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
              });

              if (!r.ok) {
                alert("Gagal menyimpan konfigurasi.");
                return;
              }

              document.getElementById("modelName").textContent =
                data.model;

              document.getElementById("status").textContent =
                "Connected";

              closeSetup();
            }

            function newChat() {
              history = [];

              document.getElementById("messages").innerHTML = `
                <div class="welcome" id="welcome">
                  <h1>How can I help you?</h1>
                  <p class="hint">
                    Percakapan baru dimulai.
                  </p>
                </div>
              `;
            }

            function addMessage(role, text) {
              const welcome =
                document.getElementById("welcome");

              if (welcome) welcome.remove();

              const box =
                document.createElement("div");

              box.className =
                "message " + role;

              box.innerHTML = `
                <div class="avatar">
                  ${role === "user" ? "U" : "AI"}
                </div>
                <div class="content"></div>
              `;

              box.querySelector(".content").textContent = text;

              document.getElementById("messages").appendChild(box);

              box.scrollIntoView({
                behavior: "smooth",
                block: "end"
              });

              return box.querySelector(".content");
            }

            async function sendMessage() {
              const input =
                document.getElementById("input");

              const text = input.value.trim();

              if (!text) return;

              input.value = "";

              addMessage("user", text);

              history.push({
                role: "user",
                content: text
              });

              const aiBox = addMessage(
                "assistant",
                "Thinking..."
              );

              document.getElementById("send").disabled =
                true;

              document.getElementById("status").textContent =
                "Thinking...";

              try {
                const r = await fetch("/api/chat", {
                  method: "POST",
                  headers: {
                    "Content-Type": "application/json"
                  },
                  body: JSON.stringify({
                    messages: history
                  })
                });

                const data = await r.json();

                if (!r.ok) {
                  throw new Error(
                    data.error || "API error"
                  );
                }

                const answer =
                  data.content || "Tidak ada respons.";

                aiBox.textContent = answer;

                history.push({
                  role: "assistant",
                  content: answer
                });

                document.getElementById("status").textContent =
                  "Connected";

              } catch (e) {
                aiBox.textContent =
                  "Error: " + e.message;

                document.getElementById("status").textContent =
                  "Error";
              }

              document.getElementById("send").disabled =
                false;
            }

            function handleKey(e) {
              if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
              }
            }

            loadConfig();
          </script>

          </body>
          </html>
          '''

          def read_config():
              if not os.path.exists(CONFIG_FILE):
                  return {}

              try:
                  with open(CONFIG_FILE, "r") as f:
                      return json.load(f)
              except Exception:
                  return {}

          def write_config(data):
              with open(CONFIG_FILE, "w") as f:
                  json.dump(data, f)

          def call_ai(config, messages):
              endpoint = config.get("endpoint", "").strip()
              api_key = config.get("apikey", "").strip()
              model = config.get("model", "").strip()
              system = config.get(
                  "system",
                  "You are a helpful AI assistant."
              )

              if not endpoint:
                  raise Exception("API Endpoint belum diset.")

              if not model:
                  raise Exception("Model belum diset.")

              final_messages = []

              if system:
                  final_messages.append({
                      "role": "system",
                      "content": system
                  })

              final_messages.extend(messages)

              payload = {
                  "model": model,
                  "messages": final_messages
              }

              body = json.dumps(payload).encode()

              headers = {
                  "Content-Type": "application/json"
              }

              if api_key:
                  headers["Authorization"] = \
                      "Bearer " + api_key

              req = urllib.request.Request(
                  endpoint,
                  data=body,
                  headers=headers,
                  method="POST"
              )

              try:
                  with urllib.request.urlopen(
                      req,
                      timeout=120
                  ) as response:

                      raw = response.read().decode()

              except urllib.error.HTTPError as e:
                  error_body = e.read().decode(
                      errors="replace"
                  )

                  raise Exception(
                      "HTTP %s: %s"
                      % (e.code, error_body[:1000])
                  )

              except Exception as e:
                  raise Exception(
                      "Gagal menghubungi API: " + str(e)
                  )

              try:
                  data = json.loads(raw)
              except Exception:
                  raise Exception(
                      "Response API bukan JSON: " +
                      raw[:500]
                  )

              try:
                  return data["choices"][0]["message"]["content"]
              except Exception:
                  pass

              if "content" in data:
                  return data["content"]

              if "response" in data:
                  return data["response"]

              raise Exception(
                  "Format response API tidak dikenali: " +
                  json.dumps(data)[:1000]
              )

          class Handler(BaseHTTPRequestHandler):

              def send_json(self, obj, status=200):
                  raw = json.dumps(obj).encode()

                  self.send_response(status)

                  self.send_header(
                      "Content-Type",
                      "application/json"
                  )

                  self.send_header(
                      "Content-Length",
                      str(len(raw))
                  )

                  self.send_header(
                      "Access-Control-Allow-Origin",
                      "*"
                  )

                  self.end_headers()
                  self.wfile.write(raw)

              def do_GET(self):

                  if self.path == "/":
                      raw = HTML.encode()

                      self.send_response(200)

                      self.send_header(
                          "Content-Type",
                          "text/html; charset=utf-8"
                      )

                      self.send_header(
                          "Content-Length",
                          str(len(raw))
                      )

                      self.end_headers()
                      self.wfile.write(raw)
                      return

                  if self.path == "/api/config":
                      config = read_config()

                      # Jangan kirim API key ke browser
                      safe = {
                          "endpoint":
                              config.get("endpoint", ""),

                          "model":
                              config.get("model", ""),

                          "system":
                              config.get("system", ""),

                          "apikey":
                              config.get("apikey", "")
                      }

                      self.send_json(safe)
                      return

                  self.send_json(
                      {"error": "Not found"},
                      404
                  )

              def do_POST(self):

                  length = int(
                      self.headers.get(
                          "Content-Length",
                          "0"
                      )
                  )

                  body = self.rfile.read(length)

                  try:
                      data = json.loads(body)
                  except Exception:
                      self.send_json(
                          {"error": "Invalid JSON"},
                          400
                      )
                      return

                  if self.path == "/api/config":
                      write_config({
                          "endpoint":
                              data.get("endpoint", "").strip(),

                          "apikey":
                              data.get("apikey", "").strip(),

                          "model":
                              data.get("model", "").strip(),

                          "system":
                              data.get(
                                  "system",
                                  ""
                              ).strip()
                      })

                      self.send_json({
                          "ok": True
                      })

                      return

                  if self.path == "/api/chat":

                      try:
                          config = read_config()

                          messages = data.get(
                              "messages",
                              []
                          )

                          answer = call_ai(
                              config,
                              messages
                          )

                          self.send_json({
                              "content": answer
                          })

                      except Exception as e:

                          self.send_json({
                              "error": str(e)
                          }, 500)

                      return

                  self.send_json(
                      {"error": "Not found"},
                      404
                  )

              def log_message(
                  self,
                  format,
                  *args
              ):
                  print(
                      "[WEB]",
                      format % args
                  )

          print(
              "AI Agent listening on port",
              PORT
          )

          server = ThreadingHTTPServer(
              ("0.0.0.0", PORT),
              Handler
          )

          server.serve_forever()
          PY

      - name: Start AI Agent
        working-directory: app
        run: |
          nohup python3 server.py > server.log 2>&1 &
          echo $! > server.pid

          sleep 3

          echo "===== SERVER ====="
          cat server.log || true

          echo "===== PORT ====="
          curl -I http://127.0.0.1:8080/ || true

      - name: Start Cloudflare Tunnel
        run: |
          nohup cloudflared tunnel \
            --url http://127.0.0.1:8080 \
            --no-autoupdate \
            > cloudflare.log 2>&1 &

          echo $! > cloudflare.pid

          echo "Menunggu Cloudflare Tunnel..."

          for i in {1..30}; do
            sleep 2

            URL=$(grep -oE \
              'https://[-a-zA-Z0-9]+\.trycloudflare\.com' \
              cloudflare.log | head -1 || true)

            if [ -n "$URL" ]; then
              echo ""
              echo "=========================================="
              echo "        AI AGENT PUBLIC URL"
              echo "=========================================="
              echo "$URL"
              echo "=========================================="
              echo ""
              break
            fi
          done

          echo "===== CLOUDFLARE LOG ====="
          cat cloudflare.log

      - name: Keep service alive
        run: |
          echo ""
          echo "=========================================="
          echo " AI AGENT BERJALAN"
          echo "=========================================="
          echo ""
          echo "Buka URL trycloudflare.com di atas."
          echo "Pertama kali akan muncul Setup Wizard."
          echo ""
          echo "Isi:"
          echo "  API Endpoint"
          echo "  API Key"
          echo "  Model"
          echo "  System Prompt"
          echo ""
          echo "Jangan tutup workflow jika ingin server tetap aktif."
          echo ""

          tail -f /dev/null
